name: Permanent progression and direct cards validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: permanent-progression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Source and task
        run: |
          node scripts/ci/validate_source.cjs
          node scripts/codex/check_context.cjs --task docs/tasks/PERMANENT_PROGRESSION_UI_001.md
      - name: Purchases refunds Farm and chronology
        run: |
          node tests/behavioral/permanent-progression.cjs index.html
          node tests/behavioral/permanent-progression-offline.cjs index.html
          node tests/behavioral/workshop-card-clarity.cjs index.html
          node tests/behavioral/forge-expansion.cjs index.html --negative
          node tests/behavioral/lab-expansion.cjs index.html --negative
          node tests/behavioral/endless-price-cache.cjs index.html
      - name: Native browser input across 18 profiles
        run: node tests/behavioral/lab-speed-controls.cjs index.html --permanent --evidence permanent-evidence/mobile
      - name: Preserve mobile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: permanent-progression-${{ github.run_id }}
          path: permanent-evidence/
          if-no-files-found: error
