name: Pre-merge validation

on:
  pull_request:
    branches: [main, 'feature/progression-expansion-2026-10-09']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lumenfall-pre-merge-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Lumenfall pre-merge validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      - name: APK identity verifier self-test
        run: node scripts/verify_apk_identity.cjs --self-test

      - name: Repository migration version and historical-baseline controls
        run: node tests/tooling/repository-migration.cjs

      - name: Node tooling regression checks
        run: |
          node tests/tooling/run.cjs
          node tests/tooling/process-tree.cjs
          node tests/tooling/behavioral-plan.cjs
          node tests/tooling/release-ci-job-gate.cjs
          node tests/tooling/offline-parallel.cjs

      - name: Validate game source
        shell: bash
        run: |
          node scripts/ci/validate_source.cjs

      - name: Verify existing independent offline reference binding
        run: |
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),crypto=require('node:crypto');
          const golden=JSON.parse(fs.readFileSync('tests/behavioral/offline-swift-current-golden.json'));
          const source=crypto.createHash('sha256').update(fs.readFileSync('index.html')).digest('hex');
          assert.equal(source,golden.sourceSha256,'Regenerate independent one-second windows after product changes');
          JS

      - name: Stage web assets
        shell: bash
        run: |
          rm -rf mobile/www
          mkdir -p mobile/www/fonts mobile/www/branding
          cp index.html mobile/www/index.html
          cp -r fonts/. mobile/www/fonts/
          cp -r branding/. mobile/www/branding/

      - name: Phone feedback startup and input acceptance
        run: |
          node scripts/codex/check_context.cjs --task docs/tasks/MOBILE_FEEDBACK_001.md
          node tests/behavioral/startup-order.cjs
          node tests/behavioral/mobile-feedback.cjs validation-evidence/mobile-feedback

      - name: Existing settled-screen UI acceptance after actual startup
        run: |
          for SCENARIO in formation-collapse resonate-clarity upgrade-identity-ui upgrade-identity-reduced-motion wisp-upgrade-display lab-motes-ui inquiry-ui inquiry-ui-reduced-motion; do
            node tests/behavioral/run.cjs --web-root mobile/www --scenario "$SCENARIO" --raw-artifacts validation-evidence/settled-startup-ui
          done

      - name: Midgame Farm guidance existing acceptance
        run: |
          node scripts/codex/check_context.cjs --task docs/tasks/MIDGAME_FARM_ACCEPT_001.md
          node scripts/codex/check_context.cjs --task docs/tasks/RIFT_HINT_READABILITY_002.md
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          node tests/behavioral/rift-guidance.cjs "$CHROME" mobile/www validation-evidence/midgame-farm-mobile --midgame-accept
          for CONTROL in open refresh; do
            if node tests/behavioral/rift-guidance.cjs "$CHROME" mobile/www "validation-evidence/hint-control-$CONTROL" --midgame-accept "--mutate-hint-$CONTROL"; then
              echo "::error::Hint control unexpectedly passed: $CONTROL"
              exit 1
            fi
          done
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const good=JSON.parse(fs.readFileSync('validation-evidence/midgame-farm-mobile/results.json'));
          assert.equal(good.status,'pass');assert.equal(good.records.length,18);
          for(const [control,message] of [['open','keyboard opens Lab details dialog'],['refresh','open details refresh both exact shortfalls']]){
            const bad=JSON.parse(fs.readFileSync('validation-evidence/hint-control-'+control+'/results.json'));
            assert.equal(bad.status,'fail');assert(bad.message.includes(message));
            assert.notEqual(bad.sourceSha256,good.sourceSha256);assert.deepEqual(bad.runtimeErrors,[]);
            assert.equal(bad.teardown.code,0);assert(!bad.teardown.signal);
          }
          JS

      - name: Legacy Rift layout with complete Farm dialog content
        run: |
          for SCENARIO in layout-fresh layout-dense layout-boss layout-accessibility-states; do
            node tests/behavioral/run.cjs --web-root mobile/www --scenario "$SCENARIO" --raw-artifacts validation-evidence/hint-layout-early
          done

      - name: Endless progression amounts, gates, persistence and chronology
        run: |
          mkdir -p validation-evidence/endless-progression
          node scripts/codex/check_context.cjs --task docs/tasks/ENDLESS_PROGRESSION_001.md
          node tests/behavioral/game-amount.cjs > validation-evidence/endless-progression/amounts.json
          node tests/behavioral/game-amount-integer.cjs > validation-evidence/endless-progression/amount-integers.json
          node tests/behavioral/game-amount-memoization.cjs > validation-evidence/endless-progression/amount-memoization.json
          node tests/behavioral/game-amount-multiplication.cjs > validation-evidence/endless-progression/amount-multiplication.json
          node tests/behavioral/endless-price-cache.cjs index.html > validation-evidence/endless-progression/prices.json
          node tests/behavioral/endless-income.cjs index.html --focus-f > validation-evidence/endless-progression/income.json
          node tests/behavioral/endless-comet-amount.cjs index.html > validation-evidence/endless-progression/comet-amount.json
          node tests/behavioral/endless-mote-batch.cjs index.html > validation-evidence/endless-progression/mote-batch.json
          node tests/behavioral/endless-wide-engine.cjs index.html > validation-evidence/endless-progression/wide.json
          node tests/behavioral/endless-ascend-counters.cjs index.html > validation-evidence/endless-progression/ascend-counters.json
          node tests/behavioral/endless-progression-core.cjs index.html --focus-f > validation-evidence/endless-progression/core.json
          node tests/behavioral/endless-guidance.cjs index.html --negative > validation-evidence/endless-progression/guidance.json
          node scripts/codex/check_context.cjs --task docs/tasks/MIDGAME_FARM_GUIDANCE_001.md
          node tests/behavioral/midgame-farm-guidance.cjs index.html --negative > validation-evidence/endless-progression/midgame-farm-guidance.json
          node tests/behavioral/endless-controls.cjs index.html --focus-f > validation-evidence/endless-progression/controls.json
          node tests/behavioral/endless-parity.cjs index.html > validation-evidence/endless-progression/parity.json
          node tests/behavioral/endless-campaign-offline.cjs index.html > validation-evidence/endless-progression/campaign-offline.json
          node tests/behavioral/endless-mobile.cjs index.html validation-evidence/endless-progression/mobile --focus-f

      - name: Endless automation clock and repeated Ascend regressions
        run: |
          node tests/behavioral/simulation-binary-clock.cjs ../../scripts/lib/simulation-limb-clock.cjs > validation-evidence/endless-progression/clock-oracle.json
          node tests/behavioral/simulation-limb-clock.cjs > validation-evidence/endless-progression/clock-compatibility.json
          node tests/behavioral/endless-clock-activation.cjs index.html > validation-evidence/endless-progression/clock-activation.json
          node tests/behavioral/endless-requirement-boundaries.cjs index.html --focus-f > validation-evidence/endless-progression/requirement-boundaries.json
          node tests/behavioral/endless-cycle-batch.cjs > validation-evidence/endless-progression/cycle-batch.json
          node tests/behavioral/endless-cycle-boundaries.cjs > validation-evidence/endless-progression/cycle-boundaries.json
          node tests/behavioral/endless-cycle-automation.cjs > validation-evidence/endless-progression/cycle-automation.json
          node tests/behavioral/endless-cycle-persistence.cjs > validation-evidence/endless-progression/cycle-ownership.json
          node tests/behavioral/endless-automation-persistence.cjs > validation-evidence/endless-progression/timer-storage.json
          node tests/behavioral/endless-automation-transitions.cjs > validation-evidence/endless-progression/empty-ticks.json
          node tests/behavioral/endless-cycle-resource-replay.cjs > validation-evidence/endless-progression/resource-replay.json
          node tests/behavioral/endless-cycle-native-wallets.cjs > validation-evidence/endless-progression/native-wallets.json
          node tests/behavioral/endless-cycle-split.cjs > validation-evidence/endless-progression/live-parity.json
          LUMENFALL_CYCLE_COLD_FRAMES=1 node tests/behavioral/endless-cycle-split.cjs > validation-evidence/endless-progression/cold-parity.json
          node tests/behavioral/endless-cycle-overflow.cjs > validation-evidence/endless-progression/high-mastery.json
          node tests/behavioral/endless-cycle-controls.cjs validation-evidence/endless-progression/cycle-controls > validation-evidence/endless-progression/cycle-controls.json

      - name: Guidance baseline readability and exact old-width inverse
        run: |
          node scripts/codex/check_context.cjs --task docs/tasks/GUIDANCE_READABILITY_001.md
          node scripts/ci/guidance-readability.cjs validation-evidence/guidance-readability

      - name: Preserve early Guidance readability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guidance-readability-evidence-${{ github.run_id }}
          retention-days: 14
          path: validation-evidence/guidance-readability/

      - name: Rift cosmetics selection, persistence and mobile acceptance
        run: node tests/behavioral/rift-cosmetics.cjs --source mobile/www/index.html --negative

      - name: Exact Prism earning numerical and causal regression
        run: node tests/behavioral/prism-earning.cjs --source mobile/www/index.html

      - name: Tree caps original-value refunds and current collection
        run: |
          node tests/behavioral/cheaper-recruitment-integrated.cjs index.html validation-evidence/f21-integration.json
          node scripts/codex/check_context.cjs --task docs/tasks/ECHOING_REST_CAP_001.md
          node tests/behavioral/echo-refund-core.cjs index.html --negative --output validation-evidence/f20-core.json
          node tests/behavioral/cheaper-recruitment.cjs --source index.html --echo --output validation-evidence/f21-f20-browser.json
          node tests/behavioral/cheaper-recruitment-negative.cjs index.html validation-evidence/f21-negative

      - name: Swift cap, original Shard value and reachable Forge Deeds
        run: |
          node scripts/codex/check_context.cjs --task docs/tasks/SWIFT_CURRENT_001.md
          node tests/behavioral/swift-current-core.cjs --negative > validation-evidence/swift-current-core.json
          node tests/behavioral/swift-current-legacy.cjs index.html > validation-evidence/swift-current-modern.json

      - name: Wisp contribution readability and unchanged gameplay
        run: |
          node tests/behavioral/support-recast-current.cjs index.html --negative > validation-evidence/support-recast.json
          node tests/behavioral/early-wisp-curve-current.cjs index.html --negative > validation-evidence/early-wisp-curve.json
          node scripts/codex/check_context.cjs --task docs/tasks/WISP_CONTRIBUTION_001.md
          node tests/behavioral/wisp-contribution-core.cjs index.html --negative --preservation > validation-evidence/wisp-contribution-core.json
          node tests/behavioral/wisp-contribution-mobile.cjs index.html validation-evidence/wisp-contribution-mobile

      - name: Compact Wisp cards, live next action and original purchase preservation
        run: |
          node scripts/codex/check_context.cjs --task docs/tasks/WISP_ACTION_HIERARCHY_001.md
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          node tests/behavioral/wisp-upgrades.cjs --chrome "$CHROME" --compact --evidence validation-evidence/wisp-compact/current
          if node tests/behavioral/wisp-upgrades.cjs --chrome "$CHROME" --compact --mutate-primary --evidence validation-evidence/wisp-compact/control; then
            echo "::error::Disabled primary-action defect unexpectedly passed."
            exit 1
          fi
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const good=JSON.parse(fs.readFileSync('validation-evidence/wisp-compact/current/wisp-upgrades-result.json'));
          const bad=JSON.parse(fs.readFileSync('validation-evidence/wisp-compact/control/wisp-upgrades-result.json'));
          assert.equal(good.status,'pass');assert.equal(good.records.length,18);
          assert.equal(bad.status,'fail');assert.match(bad.message,/unfunded card has no suggested purchase/);
          assert.notEqual(bad.sourceSha256,good.sourceSha256);assert(!bad.teardown);
          JS

          if node tests/behavioral/wisp-upgrades.cjs --chrome "$CHROME" --compact --mutate-names --evidence validation-evidence/wisp-compact/control-names; then
            echo "::error::Stale accessible-name defect unexpectedly passed."
            exit 1
          fi
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const good=JSON.parse(fs.readFileSync('validation-evidence/wisp-compact/current/wisp-upgrades-result.json'));
          const bad=JSON.parse(fs.readFileSync('validation-evidence/wisp-compact/control-names/wisp-upgrades-result.json'));
          assert.equal(bad.status,'fail');assert.match(bad.message,/next cue included in accessible name before refresh/);
          assert.notEqual(bad.sourceSha256,good.sourceSha256);assert(!bad.teardown);
          JS

      - name: Development currency UI and retained-value acceptance
        run: |
          node scripts/codex/check_context.cjs --task docs/tasks/PRISM_EARNING_001.md
          node scripts/codex/check_context.cjs --task docs/tasks/PROGRESSION_EXPANSION_001.md
          node tests/behavioral/collection-price-ui.cjs index.html /tmp/lumenfall-collection-price --negative
          node tests/behavioral/upgrade-affordability.cjs index.html validation-evidence/upgrade-affordability --negative

      - name: Read Ascend alerts and stationary daily quest claims
        shell: bash
        run: |
          node tests/behavioral/ui-attention-quest.cjs index.html > validation-evidence/ui-attention-quest.json
          if node tests/behavioral/ui-attention-quest.cjs index.html --mutate-attention --ascend-only > validation-evidence/ui-attention-control.json; then
            echo "::error::Undoing Ascend acknowledgement unexpectedly passed."
            exit 1
          fi
          if node tests/behavioral/ui-attention-quest.cjs index.html --mutate-quest-focus --quest-only > validation-evidence/ui-quest-control.json; then
            echo "::error::Undoing same-row quest focus unexpectedly passed."
            exit 1
          fi
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),crypto=require('node:crypto');
          const original=crypto.createHash('sha256').update(fs.readFileSync('index.html')).digest('hex');
          for(const [file,message] of [['ui-attention-control.json','entering Ascend clears notification'],['ui-quest-control.json','claim keeps exact scroll position']]){
            const result=JSON.parse(fs.readFileSync('validation-evidence/'+file));
            assert.equal(result.status,'FAIL');assert.match(result.error,/AssertionError/);
            assert(result.error.includes(message));assert.notEqual(result.sourceSha256,original);
            assert(!result.teardown,'negative control must exit and clean up normally');
          }
          JS

      - name: Cheaper Recruitment cap and refund regression
        run: node tests/behavioral/cheaper-recruitment.cjs --source mobile/www/index.html --output /tmp/cheaper-recruitment.json

      - name: Independent exact Prism funding oracle
        run: node tests/behavioral/cheaper-payment-oracle.cjs --source mobile/www/index.html --output /tmp/cheaper-payment-oracle.json

      - name: Cheaper Recruitment defect controls
        shell: bash
        run: |
          set -euo pipefail
          for mutation in handler refund credit free-credit wallet receipt cache credit-record ascend-copy version-check credit-reconcile below-cap-receipt missing-receipt canonical-price mixed-payment power-spacing funding-sources; do
            if node tests/behavioral/cheaper-recruitment.cjs --source mobile/www/index.html --mutation "$mutation" --output "/tmp/cheaper-recruitment-$mutation.json"; then
              echo "::error::Cheaper Recruitment mutation '$mutation' unexpectedly passed."
              exit 1
            fi
            node - "$mutation" "/tmp/cheaper-recruitment-$mutation.json" <<'JS'
          const fs = require('node:fs'), assert = require('node:assert/strict');
          const result = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const expected = {handler:'UI maxed even with affordable wallet',refund:'refund receipt prevents a second credit',credit:'fractional original wallet retains exact refund value', 'free-credit':'real Swift3 price debits wallet and small credit exactly',wallet:'large wallet quote conserves exact value',receipt:'wrong receipt amount rejects for recovery',cache:'completed large refund avoids repeated price calculation at Ascend boundaries','credit-record':'malformed persisted Prism credit rejects for recovery','ascend-copy':'actual auto-Ascends avoid repeated refund cloning and validation','version-check':'unsupported migration version rejects before any early return','credit-reconcile':'own credit sequence reconciles with saved receipt','below-cap-receipt':'below-cap receipt rejects before legitimate purchase','missing-receipt':'completed marker cannot refund again after receipt deletion','canonical-price':'all finite original purchase value retained','mixed-payment':'wallet-only payment preserves original small credit','power-spacing':'downward ULP at power of two supports exact mixed payment','funding-sources':'best exact available contribution finds payable Tree price'};
          assert.equal(result.status, 'FAIL');
          assert(result.failure.includes(expected[process.argv[2]]), 'Expected causal assertion missing');
          assert.equal(result.teardown.browser.code, 0);
          assert.equal(result.teardown.pending, 0);
          JS
          done

      - name: Behavioral harness negative self-test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-evidence
          {
            for scenario in self-test-bad-assertion self-test-uncaught-error self-test-unhandled-rejection self-test-parity-regression self-test-chronology-regression self-test-wisp-formula-regression self-test-wisp-pacing-regression self-test-endgame-currency-regression self-test-wisp-role-regression self-test-p1-05-selected self-test-p1-05-focus-return self-test-lifecycle-duplicate self-test-save-backup-placement self-test-save-backup-confirmation self-test-upgrade-identity-buy self-test-upgrade-identity-value self-test-upgrade-identity-clock self-test-ascend-prisms-tree self-test-ascend-prisms-lab self-test-ascend-prisms-payout self-test-ascend-prisms-repeat self-test-ascend-prisms-rounding; do
              if node tests/behavioral/run.cjs --web-root mobile/www --scenario "$scenario" --raw-artifacts validation-evidence/negative-raw; then
                echo "::error::Behavioral harness negative scenario '$scenario' unexpectedly passed."
                exit 1
              fi
              echo "Behavioral harness correctly caught expected failure: $scenario"
            done
          } 2>&1 | tee validation-evidence/negative-self-tests.log

      - name: Stateful behavioral regression suite
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p validation-evidence
          git rev-parse HEAD > validation-evidence/commit.txt
          sha256sum index.html > validation-evidence/source-sha256.txt
          node tests/behavioral/run.cjs --web-root mobile/www --ci-group main --raw-artifacts validation-evidence/raw 2>&1 | tee validation-evidence/behavioral.log | node scripts/ci/behavioral-console.cjs

      - name: Install runtime error guard in staged copy
        shell: bash
        run: |
          node scripts/ci/smoke.cjs --install-guard mobile/www/index.html

      - name: Browser runtime smoke test
        shell: bash
        run: |
          set -euo pipefail

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No supported Chromium browser found on the runner."
            exit 1
          fi

          node scripts/serve.cjs --port 4173 --directory mobile/www >/tmp/lumenfall-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT

          ready=0
          for _ in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null && curl --fail --silent http://127.0.0.1:4173/branding/lumenfall-mark.svg >/dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/lumenfall-http.log
            exit 1
          fi

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --window-size=390,844 \
            --virtual-time-budget=1800 \
            --dump-dom \
            http://127.0.0.1:4173/index.html \
            >/tmp/lumenfall-dom.html 2>/tmp/lumenfall-chrome.log

          node scripts/ci/smoke.cjs --dom /tmp/lumenfall-dom.html --chrome-log /tmp/lumenfall-chrome.log --require-guard

      - name: Preserve full regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-merge-evidence-${{ github.run_id }}
          retention-days: 14
          path: |
            validation-evidence/
            /tmp/lumenfall-collection-price/
            /tmp/lumenfall-dom.html
            /tmp/lumenfall-chrome.log
            /tmp/lumenfall-http.log

  offline_catchup:
    name: Lumenfall isolated offline catch-up
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Stage exact product and assets
        shell: bash
        run: |
          mkdir -p mobile/www/fonts mobile/www/branding validation-evidence/isolated-offline
          cp index.html mobile/www/index.html
          cp -r fonts/. mobile/www/fonts/
          cp -r branding/. mobile/www/branding/
          git rev-parse HEAD > validation-evidence/isolated-offline/commit.txt
          sha256sum index.html > validation-evidence/isolated-offline/source.txt
      - name: Original offline regression with unchanged assertions and deadline
        shell: bash
        run: |
          set -euo pipefail
          node tests/behavioral/run.cjs --web-root mobile/www --ci-group offline --raw-artifacts validation-evidence/isolated-offline/raw 2>&1 | tee validation-evidence/isolated-offline/behavioral.log | node scripts/ci/behavioral-console.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-offline-evidence-${{ github.run_id }}
          path: validation-evidence/isolated-offline/
