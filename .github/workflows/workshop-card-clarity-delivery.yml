name: Workshop card clarity acceptance and delivery
# Temporary bridge for approved PR #13; remove after verified delivery.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths:
      - .github/workflows/workshop-card-clarity-delivery.yml
      - scripts/ci/workshop-card-clarity-delivery.cjs
permissions:
  contents: read
concurrency:
  group: workshop-clarity-delivery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  legacy-flows:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 13 && github.repository == 'xariib/Lumenfall'
    name: Legacy flow (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: [offline-12h-ui, auto-ascend-target-resume, auto-ascend-target-cold-resume, rift-status-stacking-mobile, rift-status-stacking-reduced-motion, upgrade-effects-and-deeds, rift-status-contract, bond-text-contract, rift-status-mobile, rift-status-reduced-motion, forge-contracts, r3-destinations, p1-05-control-regressions, p2-endgame-currency-utility]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Validate source, delivery script and slot lifecycle
        run: |
          node --check scripts/ci/workshop-card-clarity-delivery.cjs
          node scripts/ci/validate_source.cjs
          node tests/behavioral/workshop-card-clarity.cjs index.html
          node scripts/codex/check_context.cjs --task docs/tasks/WORKSHOP_CARD_CLARITY_001.md
      - name: Stage exact game and assets
        run: |
          mkdir -p mobile/www/fonts mobile/www/branding
          cp index.html mobile/www/index.html
          cp -r fonts/. mobile/www/fonts/
          cp -r branding/. mobile/www/branding/
      - name: Original scenario with its full assertions and deadlines
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: node tests/behavioral/run.cjs --web-root mobile/www --scenario "$SCENARIO" --raw-artifacts validation-evidence/legacy-flows
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workshop-legacy-${{ matrix.scenario }}-${{ github.run_id }}
          retention-days: 14
          path: validation-evidence/legacy-flows/
  integrated-gates:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'xariib/Lumenfall'
    name: Integrated gate (${{ matrix.workflow }})
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        workflow: [pre-merge-validation.yml, comet-expansion-validation.yml, forge-expansion-validation.yml, lab-expansion-validation.yml, shared-ui-validation.yml, tree-focused-qa.yml]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Dispatch and require the original integrated-commit gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/workshop-card-clarity-delivery.cjs validate "${{ matrix.workflow }}"
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'xariib/Lumenfall'
    needs: integrated-gates
    name: Signed Android acceptance, publication and public download
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Require all original gates and dispatch normal signed Android build
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/workshop-card-clarity-delivery.cjs publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workshop-public-download-${{ github.run_id }}
          path: validation-evidence/workshop-delivery/
