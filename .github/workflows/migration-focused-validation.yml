name: Rift Lab touch diagnostic (not release acceptance)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        mode: [trace, agents]
        repeat: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Record source and environment
        run: |
          mkdir -p validation-evidence/input-diagnostic
          git rev-parse HEAD > validation-evidence/input-diagnostic/commit.txt
          sha256sum index.html tests/behavioral/lab-speed-controls.cjs tests/behavioral/lab-boost-queue-ui.cjs tests/behavioral/lab-speed-presets-ui.cjs > validation-evidence/input-diagnostic/hashes.txt
          google-chrome --version
          node --version
      - name: Retain original assertions and deadlines with diagnostic tracing
        env:
          DIAGNOSTIC_MODE: ${{ matrix.mode }}
        run: node tests/behavioral/rift-input-diagnostic.cjs "$DIAGNOSTIC_MODE" validation-evidence/input-diagnostic
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: input-diagnostic-${{ matrix.mode }}-${{ matrix.repeat }}-${{ github.run_id }}
          path: validation-evidence/input-diagnostic/
