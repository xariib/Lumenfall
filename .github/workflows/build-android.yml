name: Build Android APK
# Node.js validation/build support; established Android signing and release flow.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only after all integrated-commit CI and APK checks pass
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: lumenfall-android-main
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require integrated validation before publishing
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/release-ci-gate.cjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -n "$ANDROID_HOME"
          test -d "$ANDROID_HOME"

      - name: Restore and verify stable Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.LUMENFALL_KEYSTORE_BASE64 }}
          EXPECTED_SIGNING_SHA256: "A9:1C:BF:34:27:D2:CE:B1:CD:BE:07:E5:22:5F:17:D4:71:B1:82:9E:52:F7:AB:66:49:7E:75:49:75:AD:3E:21"
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_DIR="$RUNNER_TEMP/lumenfall-signing"
          KEYSTORE_FILE="$KEYSTORE_DIR/Lumenfall-debug.keystore"
          KEYTOOL_OUTPUT="$KEYSTORE_DIR/keytool-output.txt"
          mkdir -p "$KEYSTORE_DIR" "$HOME/.android"
          test -n "$KEYSTORE_BASE64" || { echo "::error::Original signing secret is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "::error::Established Android signing keystore is missing or empty. Refusing to build or publish."
            exit 1
          fi

          if ! keytool -list -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass android \
            -alias androiddebugkey >"$KEYTOOL_OUTPUT" 2>/dev/null; then
            echo "::error::Established Android signing keystore is unreadable, corrupt, or invalid for the expected signing alias. Refusing to build or publish."
            exit 1
          fi

          ACTUAL_SIGNING_SHA256="$(awk -F'SHA256: ' '/SHA256:/{print $2; exit}' "$KEYTOOL_OUTPUT" | tr -d '\r')"
          rm -f "$KEYTOOL_OUTPUT"

          if [ -z "$ACTUAL_SIGNING_SHA256" ]; then
            echo "::error::Could not determine the Android signing certificate fingerprint. Refusing to build or publish."
            exit 1
          fi

          if [ "$ACTUAL_SIGNING_SHA256" != "$EXPECTED_SIGNING_SHA256" ]; then
            echo "::error::Android signing certificate mismatch. Expected $EXPECTED_SIGNING_SHA256 but restored $ACTUAL_SIGNING_SHA256. Refusing to build or publish."
            exit 1
          fi

          cp "$KEYSTORE_FILE" "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

          echo "Verified established Android signing certificate SHA256: $ACTUAL_SIGNING_SHA256"

      - name: Install Capacitor dependencies
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Validate game source
        shell: bash
        run: |
          node scripts/ci/validate_source.cjs

      - name: Stage Android web assets
        working-directory: mobile
        run: |
          rm -rf www
          mkdir -p www/fonts www/branding
          cp ../index.html www/index.html
          cp -r ../fonts/. www/fonts/
          cp -r ../branding/. www/branding/

      - name: Browser runtime smoke test
        shell: bash
        run: |
          set -euo pipefail

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No supported Chromium browser found on the runner."
            exit 1
          fi

          node scripts/serve.cjs --port 4173 --directory mobile/www >/tmp/lumenfall-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" >/dev/null 2>&1 || true' EXIT

          ready=0
          for _ in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null && curl --fail --silent http://127.0.0.1:4173/branding/lumenfall-mark.svg >/dev/null; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/lumenfall-http.log
            exit 1
          fi

          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --window-size=390,844 \
            --virtual-time-budget=1800 \
            --dump-dom \
            http://127.0.0.1:4173/index.html \
            >/tmp/lumenfall-dom.html 2>/tmp/lumenfall-chrome.log

          node scripts/ci/smoke.cjs --dom /tmp/lumenfall-dom.html

      - name: Generate Android project
        working-directory: mobile
        run: npx cap add android

      - name: Compute continuing Android version
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/android-release-version.cjs

      - name: Set Android app version
        run: node scripts/ci/set_android_version.cjs

      - name: Stage Android icon and splash sources
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          node <<'NODE'
          const sharp = require('sharp');
          const markPath = '../branding/lumenfall-mark.svg';
          const bg = { r: 8, g: 16, b: 39, alpha: 1 };

          async function transparentCanvas(size, markSize) {
            const mark = await sharp(markPath).resize(markSize, markSize, { fit: 'contain' }).png().toBuffer();
            return sharp({ create: { width: size, height: size, channels: 4, background: { r:0,g:0,b:0,alpha:0 } } })
              .composite([{ input: mark, gravity: 'center' }]).png().toBuffer();
          }

          async function main() {
            const iconMark = await transparentCanvas(1024, 820);
            await sharp({ create: { width: 1024, height: 1024, channels: 4, background: bg } })
              .composite([{ input: iconMark }]).png().toFile('assets/icon.png');

            // Adaptive foreground stays inside Android's safe zone.
            const foreground = await transparentCanvas(1024, 610);
            await sharp(foreground).png().toFile('assets/icon-foreground.png');

            await sharp({ create: { width: 1024, height: 1024, channels: 4, background: bg } })
              .png().toFile('assets/icon-background.png');

            // Native splash: minimal, centered and safe across portrait crops.
            const splashMark = await transparentCanvas(2732, 920);
            await sharp({ create: { width: 2732, height: 2732, channels: 4, background: bg } })
              .composite([{ input: splashMark }]).png().toFile('assets/splash.png');
          }

          main().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Generate Android icons and splash
        working-directory: mobile
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew

          KEYSTORE_FILE="$RUNNER_TEMP/lumenfall-signing/Lumenfall-debug.keystore"
          test -s "$KEYSTORE_FILE"

          ./gradlew assembleDebug --no-daemon \
            -Pandroid.injected.signing.store.file="$KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Prepare APK
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk Lumenfall.apk
          test -s Lumenfall.apk
          ls -lh Lumenfall.apk

      - name: Verify final APK identity
        env:
          EXPECTED_PACKAGE_ID: "com.lumenfall.app"
          EXPECTED_SIGNING_SHA256: "A9:1C:BF:34:27:D2:CE:B1:CD:BE:07:E5:22:5F:17:D4:71:B1:82:9E:52:F7:AB:66:49:7E:75:49:75:AD:3E:21"
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS_DIR=""
          while IFS= read -r candidate; do
            if [ -x "$candidate/aapt" ] && [ -x "$candidate/apksigner" ]; then
              BUILD_TOOLS_DIR="$candidate"
              break
            fi
          done < <(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -print | sort -Vr)

          if [ -z "$BUILD_TOOLS_DIR" ]; then
            echo "::error::Could not find Android build-tools containing both aapt and apksigner."
            exit 1
          fi

          mkdir -p release-evidence
          node scripts/verify_apk_identity.cjs \
            --apk Lumenfall.apk \
            --aapt "$BUILD_TOOLS_DIR/aapt" \
            --apksigner "$BUILD_TOOLS_DIR/apksigner" \
            --expected-package "$EXPECTED_PACKAGE_ID" \
            --expected-version-code "$EXPECTED_VERSION_CODE" \
            --expected-version-name "$EXPECTED_VERSION_NAME" \
            --expected-cert-sha256 "$EXPECTED_SIGNING_SHA256" | tee release-evidence/identity.txt

      - name: Verify exact packaged production assets and origin
        run: |
          mkdir -p release-evidence
          node scripts/ci/verify_apk_assets.cjs Lumenfall.apk > release-evidence/assets.json
          sha256sum Lumenfall.apk > release-evidence/apk-sha256.txt
          git rev-parse HEAD > release-evidence/commit.txt
          printf '%s\n' "$EXPECTED_VERSION_CODE" > release-evidence/version-code.txt

      - name: Enable emulator hardware acceleration
        run: |
          echo KERNEL==\"kvm\",GROUP=\"kvm\",MODE=\"0666\",OPTIONS+=\"static_node=kvm\" | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Free native build memory before emulator acceptance
        working-directory: mobile/android
        run: |
          ./gradlew --stop
          free -m

      - name: In-place signed APK and save upgrade on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 1536M
          heap-size: 256M
          cores: 2
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -verbose
          disable-animations: true
          script: node scripts/ci/android-upgrade.cjs archive/android/cheaper-bonds-cap-001/Lumenfall-0.1.158.apk Lumenfall.apk

      - name: Require completed upgrade receipt for this exact APK
        run: node scripts/ci/verify_upgrade_receipt.cjs

      - name: Preserve failed native upgrade diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p release-evidence
          sudo dmesg | tail -n 120 > release-evidence/runner-kernel.txt
          free -m > release-evidence/runner-memory.txt

      - name: Upload failed native upgrade diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-native-upgrade-${{ github.run_id }}
          path: release-evidence/

      - name: Preserve verified build
        uses: actions/upload-artifact@v4
        with:
          name: signed-apk-${{ github.run_id }}
          path: |
            Lumenfall.apk
            release-evidence/

      - name: Publish verified APK release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api repos/$GITHUB_REPOSITORY/git/ref/heads/main --jq .object.sha)" = "$GITHUB_SHA"
          node scripts/ci/android-release-version.cjs --check-published
          TAG="android-$EXPECTED_VERSION_CODE"
          gh release create "$TAG" Lumenfall.apk release-evidence/assets.json release-evidence/apk-sha256.txt release-evidence/emulator-upgrade.json release-evidence/identity.txt release-evidence/commit.txt \
            --target "$GITHUB_SHA" --latest \
            --title "Lumenfall Android $EXPECTED_VERSION_NAME" \
            --notes "Combined endless-progression release from $GITHUB_SHA. Install Lumenfall.apk as an update without uninstalling. Original package/signing/save identity retained. Physical-device, legacy WebView and TalkBack limitations are recorded in docs/tasks/REPOSITORY_MIGRATION_001.md."

      - name: Remove temporary signing copy
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/lumenfall-signing/Lumenfall-debug.keystore" "$HOME/.android/debug.keystore"
